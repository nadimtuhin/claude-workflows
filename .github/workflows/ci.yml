name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --severity=error install.sh

      - name: Check Markdown files
        run: npx --yes markdownlint-cli2 README.md CONTRIBUTING.md CODE_OF_CONDUCT.md '.claude/commands/**/*.md'
        continue-on-error: true

  install-smoke-test:
    name: Install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a fake project directory and run install
        run: |
          mkdir -p /tmp/test-project
          cd /tmp/test-project
          git init
          bash $GITHUB_WORKSPACE/install.sh
          test -d .claude/commands/development
          test -d .claude/commands/testing
          test -d .claude/commands/git
          test -d .claude/commands/deployment
          echo "Install smoke test passed"

      - name: Piped install outside a project asks the terminal, not the script
        run: |
          mkdir -p /tmp/not-a-project
          cd /tmp/not-a-project
          if out=$(bash < $GITHUB_WORKSPACE/install.sh 2>&1); then
            echo "expected the install to stop without confirmation"; exit 1
          fi
          echo "$out" | grep -q "No terminal to confirm on"
          test ! -e .claude
